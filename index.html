
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Video Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090b17;color:white;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 7%;border-bottom:1px solid #292b42}
.logo{font-size:24px;font-weight:bold;color:#a78bfa}
.credits{background:#25213f;padding:12px 18px;border-radius:25px;color:#facc15}
main{max-width:1000px;margin:55px auto;padding:0 20px}
h1{text-align:center;font-size:40px;margin-bottom:12px}
.subtitle{text-align:center;color:#a5a7bd;margin-bottom:45px}
.panel{background:#17192c;border:1px solid #30334d;padding:30px;border-radius:20px}
label{display:block;margin:20px 0 10px;font-weight:bold}
textarea,select{width:100%;padding:15px;border:1px solid #454763;border-radius:12px;background:#101224;color:white;font-size:16px}
textarea{height:130px;resize:vertical}
.options{display:grid;grid-template-columns:1fr 1fr;gap:20px}
button{width:100%;padding:17px;margin-top:30px;border:0;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#db2777);color:white;font-size:18px;font-weight:bold;cursor:pointer}
button:hover{opacity:.9}
.preview{margin-top:25px;text-align:center;padding:40px 15px;border:1px dashed #555775;border-radius:15px;color:#a5a7bd}
.note{font-size:13px;color:#a5a7bd;text-align:center;margin-top:20px}
@media(max-width:600px){.options{grid-template-columns:1fr}h1{font-size:29px}}
</style>
</head>
<body>
<header>
<div class="logo">✦ AI Video Studio</div>
<div class="credits">🪙 100 Credits</div>
</header>
<main>
<h1>Turn Your Ideas Into Videos</h1>
<p class="subtitle">Create amazing AI videos from text prompts</p>
<div class="panel">
<label>Describe your video</label>
<textarea id="prompt" placeholder="Example: A cinematic drone shot flying over beautiful mountains at sunset..."></textarea>
<div class="options">
<div>
<label>Video Duration</label>
<select id="duration">
<option value="5">5 Seconds</option>
<option value="10">10 Seconds</option>
</select>
</div>
<div>
<label>Aspect Ratio</label>
<select id="ratio">
<option>16:9 Landscape</option>
<option>9:16 Portrait</option>
<option>1:1 Square</option>
</select>
</div>
</div>
<button onclick="generate()">✦ Generate Video — 10 Credits</button>
<div class="preview" id="result">Your generated video will appear here</div>
</div>
<p class="note">Prototype version — AI generation and payments are not connected yet.</p>
</main>
<script>
function generate(){
const prompt=document.getElementById("prompt").value.trim();
const result=document.getElementById("result");
if(!prompt){result.textContent="Please describe your video first.";return;}
result.textContent="Demo mode: Your prompt is ready. AI video generation will be connected later.";
}
</script>
</body>
</html>
